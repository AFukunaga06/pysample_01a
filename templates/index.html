<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANコード管理アプリ - Web版</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>JANコード管理アプリ</h1>
            <p>Web版 - JANコードの管理とテキスト抽出</p>
        </header>

        <main>
            <!-- JANコードコピーセクション -->
            <section class="section">
                <h2>JANコードコピー</h2>
                <div class="form-group">
                    <label for="indexInput">指定した番目:</label>
                    <input type="number" id="indexInput" min="1" value="1">
                    <button onclick="copyJanCode()">JANコードを取得</button>
                </div>
                <div class="button-group">
                    <button onclick="nextJanCode()">次へ進む</button>
                    <button onclick="previousJanCode()">一つ戻る</button>
                </div>
                <div id="janResult" class="result"></div>
            </section>

            <!-- テキスト抽出セクション -->
            <section class="section">
                <h2>テキスト抽出</h2>
                <div class="form-group">
                    <label for="textInput">抽出したいテキストを入力:</label>
                    <textarea id="textInput" rows="6" placeholder="JANコードと重量情報を含むテキストを入力してください..."></textarea>
                    <button onclick="extractText()">JANコード～重量抽出</button>
                </div>
                <div id="extractResult" class="result"></div>
            </section>

            <!-- 使用方法 -->
            <section class="section">
                <h2>使用方法</h2>
                <div class="instructions">
                    <h3>JANコード機能</h3>
                    <ul>
                        <li>番目を指定してJANコードを取得</li>
                        <li>次へ進む/一つ戻るボタンで連続操作</li>
                        <li>Google Sheets未接続時はデモモードで動作</li>
                    </ul>
                    
                    <h3>テキスト抽出機能</h3>
                    <ul>
                        <li>JANコードと重量情報を含むテキストを入力</li>
                        <li>対応する重量形式: 123g, 123G, 123グラム, 重量：123g, 123ｇ</li>
                        <li>13桁または8桁のJANコードを自動検出</li>
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
